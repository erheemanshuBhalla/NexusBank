name: Deploy and Containerize

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: 🏗️ Build & Verify Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Code
        run: dotnet build --no-restore -c Release

  deploy-dev:
    name: 🚀 Deploy to DEV Environment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Az CLI Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ◄ ADD THIS AUTOMATED STEP HERE TO MAKE DEV SELF-HEALING
      - name: Ensure Development Resource Group Exists
        run: |
          az group create --name rg-nexusbank-dev --location westus --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure (Azure Bicep)
        id: bicep-deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-nexusbank-dev
          scope: resourcegroup
          template: ./Infra/main.bicep
          parameters: >-
            environment=dev
            sqlAdminPassword=${{ secrets.PROD_SQL_PASSWORD }}
          failOnStdErr: false
        # ◄ UPDATE YOUR DEPLOYMENT TO INJECT THE CONNECTION STRING
      - name: Deploy Manifests to AKS
        run: |
          # ◄ FIXED: Dynamically fetching the cluster name from Bicep outputs
          az aks get-credentials --resource-group rg-nexusbank-dev --name ${{ steps.bicep-deploy.outputs.aksClusterName }}
          
          # Inject the telemetry connection string into our pods
          kubectl set env deployment/nexusbank-api APPLICATIONINSIGHTS_CONNECTION_STRING="${{ steps.bicep-deploy.outputs.appInsightsConnectionString }}" --overwrite
          kubectl set env deployment/nexusbank-worker APPLICATIONINSIGHTS_CONNECTION_STRING="${{ steps.bicep-deploy.outputs.appInsightsConnectionString }}" --overwrite

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.bicep-deploy.outputs.acrLoginServer }}

      - name: Build and Push Api Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NexusBank.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-api:latest
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-api:${{ github.sha }}

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NexusBank.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-worker:latest
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-worker:${{ github.sha }}

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group rg-nexusbank-dev --name aks-nexus-dev-01 --overwrite-existing

      - name: Deploy Manifests to AKS
        run: |
          kubectl apply -f ./k8s/ledger-api.yaml
          kubectl apply -f ./k8s/nexus-worker.yaml

  deploy-prod:
    name: 💎 Deploy to PROD Environment
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4

      - name: Az CLI Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Production Resource Group Exists
        run: |
          az group create --name rg-nexusbank-prod --location westus --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure (Azure Bicep)
        id: bicep-deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-nexusbank-prod
          scope: resourcegroup
          template: ./Infra/main.bicep
          parameters: >-
            environment=prod
            sqlAdminPassword=${{ secrets.PROD_SQL_PASSWORD }}
          failOnStdErr: false

      - name: Deploy Manifests to AKS
        run: |
          # ◄ FIXED: Dynamically fetching the cluster name from Bicep outputs
          az aks get-credentials --resource-group rg-nexusbank-dev --name ${{ steps.bicep-deploy.outputs.aksClusterName }}
          
          # Inject the telemetry connection string into our pods
          kubectl set env deployment/nexusbank-api APPLICATIONINSIGHTS_CONNECTION_STRING="${{ steps.bicep-deploy.outputs.appInsightsConnectionString }}" --overwrite
          kubectl set env deployment/nexusbank-worker APPLICATIONINSIGHTS_CONNECTION_STRING="${{ steps.bicep-deploy.outputs.appInsightsConnectionString }}" --overwrite
          
      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.bicep-deploy.outputs.acrLoginServer }}

      - name: Build and Push Api Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NexusBank.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-api:prod-latest
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-api:${{ github.sha }}

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NexusBank.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-worker:prod-latest
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-worker:${{ github.sha }}

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group rg-nexusbank-prod --name aks-nexus-prod-01 --overwrite-existing

      - name: Deploy Manifests to AKS
        run: |
          kubectl apply -f ./k8s/ledger-api.yaml
          kubectl apply -f ./k8s/nexus-worker.yaml