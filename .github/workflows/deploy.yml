name: NexusBank Enterprise CI/CD

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  # STAGE 1: Compile and Package the Code
  build:
    name: 🏗️ Build & Package Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Services Locally
        run: |
          dotnet build NexusBank.Api/NexusBank.Api.csproj --configuration Release -p:NoWarn=CS8618
          dotnet build NexusBank.Worker/NexusBank.Worker.csproj --configuration Release -p:NoWarn=CS8618
          
      - name: Publish API Artifacts
        run: |
          # The -p flag disables the strict validation error caused by shared project dependencies!
          dotnet publish NexusBank.Api/NexusBank.Api.csproj --configuration Release --output ./publish/api -p:ErrorOnDuplicatePublishOutputFiles=false
          dotnet publish NexusBank.Worker/NexusBank.Worker.csproj --configuration Release --output ./publish/worker -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexusbank-app-package
          path: ./publish/             # Uploads the root folder containing both /api and /worker folders

  # STAGE 2: Deploy Infrastructure and Code to Azure
  deploy:
    name: 🚀 Deploy to Azure (Dev)
    needs: build # Ensures deployment ONLY happens if the build succeeds!
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexusbank-app-package  # Fixed this to match the name uploaded in Stage 1!
          path: ./publish

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # New Step: Validates and deploys your Bicep infrastructure templates
      # Updated to deploy at the subscription level so it can create the resource group if it's missing
      - name: Deploy Infrastructure (Azure Bicep)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          scope: subscription
          region: eastus # <--- Set this to your preferred Azure region (e.g., eastus, westeurope)
          template: ./Infra/main.bicep
          failOnTargetValidationError: true