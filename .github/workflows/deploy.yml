name: NexusBank Enterprise CI/CD

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  # STAGE 1: Compile and Package the Code
  build:
    name: 🏗️ Build & Package Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Services Locally
        run: |
          dotnet build NexusBank.Api/NexusBank.Api.csproj --configuration Release -p:NoWarn=CS8618
          dotnet build NexusBank.Worker/NexusBank.Worker.csproj --configuration Release -p:NoWarn=CS8618
          
      - name: Publish API Artifacts
        run: |
          dotnet publish NexusBank.Api/NexusBank.Api.csproj --configuration Release --output ./publish/api -p:ErrorOnDuplicatePublishOutputFiles=false
          dotnet publish NexusBank.Worker/NexusBank.Worker.csproj --configuration Release --output ./publish/worker -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexusbank-app-package
          path: ./publish/

  # STAGE 2: Deploy Infrastructure and Code to Azure
  deploy:
    name: 🚀 Deploy to Azure (Dev)
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexusbank-app-package
          path: ./publish

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Directly run the Bicep template deployment using your capitalized 'Infra' folder path
      - name: Deploy Infrastructure (Azure Bicep)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-nexusbank-dev
          scope: resourceGroup
          template: ./Infra/main.bicep   # <--- Fixed case from 'infra' to 'Infra'!
          failOnTargetValidationError: true