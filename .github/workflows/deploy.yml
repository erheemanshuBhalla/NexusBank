name: Deploy and Containerize

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Code
        run: dotnet build --no-restore -c Release

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Az CLI Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure (Azure Bicep)
        id: bicep-deploy
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-nexusbank-dev
          scope: resourcegroup
          template: ./Infra/main.bicep
          parameters: environment=dev
          failOnTargetValidationError: true

      # NEW STEP: Log directly into your newly spawned Azure Container Registry
      - name: Log in to Azure Container Registry
        run: |
          echo "Logging into ACR: ${{ steps.bicep-deploy.outputs.acrLoginServer }}"
          az acr login --name ${{ steps.bicep-deploy.outputs.acrLoginServer }}

      # NEW STEP: Build and Push NexusBank.Api
      - name: Build and Push Api Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NexusBank.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-api:latest
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-api:${{ github.sha }}

      # NEW STEP: Build and Push NexusBank.Worker
      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./NexusBank.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-worker:latest
            ${{ steps.bicep-deploy.outputs.acrLoginServer }}/nexusbank-worker:${{ github.sha }}